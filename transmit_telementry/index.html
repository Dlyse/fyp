<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone link</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #status { padding: 2px 8px; border-radius: 10px; background: #a33; font-size: 13px; }
  #status.up { background: #2a7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #1c1c1c; border-radius: 8px; padding: 12px; }
  img, canvas { width: 100%; background: #000; border-radius: 4px; image-rendering: pixelated; }
  .cams { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .cam div { font-size: 12px; }
  pre { margin: 0; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Drone link <span id="status">offline</span></h1>
<div class="grid">
  <div class="card" style="grid-column: 1 / -1"><div>Depth cameras</div><div id="cams" class="cams"></div></div>
  <div class="card" style="grid-column: 1 / -1">
    <div>3D view <select id="sel3d"><option value="">off</option></select>
    <small>(drag to rotate, wheel to zoom)</small></div>
    <canvas id="c3d" width="800" height="450"></canvas>
  </div>
  <div class="card"><div>Route</div><canvas id="map" width="400" height="300"></canvas></div>
  <div class="card"><div>Telemetry</div><pre id="tel"></pre></div>
</div>
<script>
let route = [], pos = null, lastUrls = {}, lastMsg = 0;
let camNames = [], meta3d = {}, want3d = "", wsRef = null, cloud = null;
const $ = id => document.getElementById(id);

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/view`);
  ws.binaryType = "arraybuffer";
  wsRef = ws;
  ws.onopen = sendView;
  ws.onclose = () => { setTimeout(connect, 2000); };
  ws.onmessage = ev => {
    lastMsg = Date.now();
    if (typeof ev.data !== "string") {
      const b = new Uint8Array(ev.data);
      const img = b[1] === 0 ? $("img-" + b[0]) : null;
      if (b[1] === 1) { showCloud(camNames[b[0]], b.subarray(2)); return; }
      if (!img) return;
      const url = URL.createObjectURL(new Blob([b.subarray(2)], { type: "image/jpeg" }));
      img.src = url;
      if (lastUrls[b[0]]) URL.revokeObjectURL(lastUrls[b[0]]);
      lastUrls[b[0]] = url;
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === "telemetry") {
      pos = m.pos || null;
      $("tel").textContent = JSON.stringify(m, null, 2);
      drawMap();
    } else if (m.type === "route") {
      route = m.points; drawMap();
    } else if (m.type === "depth3d") {
      meta3d[m.cam] = m;
    } else if (m.type === "cameras") {
      $("cams").innerHTML = m.names.map((n, i) =>
        `<div class="cam"><div>${n}</div><img id="img-${i}" alt="${n}"><div id="obs-${n}"></div></div>`).join("");
      camNames = m.names;
      $("sel3d").innerHTML = `<option value="">off</option>` + m.names.map(n => `<option>${n}</option>`).join("");
      $("sel3d").value = want3d;
    } else if (m.type === "obstacle") {
      const el = $("obs-" + m.cam);
      if (el) el.textContent = m.role === "land"
        ? `ground ${m.ground_m} m | min ${m.min_m} m`
        : `min ${m.min_m} m | L ${m.left_m} | C ${m.center_m} | R ${m.right_m}`;
    } else if (m.type === "link" && !m.up) {
      lastMsg = 0;
    }
  };
}

function drawMap() {
  const c = $("map"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const pts = route.map(p => ({ lat: p[0], lon: p[1] }));
  if (pos) pts.push({ lat: pos.lat, lon: pos.lon });
  if (!pts.length) return;
  const lat0 = pts[0].lat, lon0 = pts[0].lon;
  const k = Math.cos(lat0 * Math.PI / 180);
  const xy = pts.map(p => [(p.lon - lon0) * 111320 * k, -(p.lat - lat0) * 110540]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY, 10);
  const s = (Math.min(c.width, c.height) - 40) / span;
  const tx = p => 20 + (p[0] - minX) * s, ty = p => 20 + (p[1] - minY) * s;
  const n = route.length;
  g.strokeStyle = "#4af"; g.fillStyle = "#4af"; g.beginPath();
  xy.slice(0, n).forEach((p, i) => { i ? g.lineTo(tx(p), ty(p)) : g.moveTo(tx(p), ty(p)); });
  g.stroke();
  xy.slice(0, n).forEach(p => { g.beginPath(); g.arc(tx(p), ty(p), 3, 0, 7); g.fill(); });
  if (pos) {
    const p = xy[xy.length - 1];
    g.fillStyle = "#f84"; g.beginPath(); g.arc(tx(p), ty(p), 6, 0, 7); g.fill();
  }
}

function sendView() {
  if (wsRef && wsRef.readyState === 1) wsRef.send(JSON.stringify({ type: "view3d", cam: want3d || null }));
}
$("sel3d").onchange = e => { want3d = e.target.value; if (!want3d) cloud = null; sendView(); render(); };

async function decode(bytes, type, w, h) {
  const bmp = await createImageBitmap(new Blob([bytes], { type }), { colorSpaceConversion: "none" });
  const oc = document.createElement("canvas");
  oc.width = w; oc.height = h;
  const og = oc.getContext("2d", { willReadFrequently: true });
  og.drawImage(bmp, 0, 0, w, h);
  return og.getImageData(0, 0, w, h).data;
}

async function showCloud(cam, bytes) {
  const m = meta3d[cam];
  if (!m) return;
  const n1 = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(0);
  const png = bytes.subarray(4, 4 + n1), jpg = bytes.subarray(4 + n1);
  const px = await decode(png, "image/png", m.w, m.h);
  const cpx = jpg.length ? await decode(jpg, "image/jpeg", m.w, m.h) : null;
  const pts = new Float32Array(m.w * m.h * 3), col = new Uint32Array(m.w * m.h);
  let n = 0;
  for (let v = 0; v < m.h; v++) for (let u = 0; u < m.w; u++) {
    const i = (v * m.w + u) * 4, d = ((px[i] << 8) | px[i + 1]) / 1000;
    if (d < 0.1 || d > 8) continue;
    pts[n * 3] = (u - m.cx) * d / m.fx;
    pts[n * 3 + 1] = -(v - m.cy) * d / m.fy;
    pts[n * 3 + 2] = d;
    // real colour (grey by distance if no colour), dimmed slightly with distance for depth cue
    const s = 1 - 0.35 * Math.min(d / 6, 1);
    const r = cpx ? cpx[i] * s : 255 * s, g = cpx ? cpx[i + 1] * s : 255 * s, b = cpx ? cpx[i + 2] * s : 255 * s;
    col[n++] = ((255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
  }
  cloud = { pts, col, n };
  render();
}

const view = { yaw: 0.4, pitch: 0.25, dist: 5 };
function render() {
  const c = $("c3d"), g = c.getContext("2d"), W = c.width, H = c.height;
  const img = g.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
  buf.fill(0xff111111);
  if (cloud) {
    const zb = new Float32Array(W * H).fill(1e9), f = H * 0.9;
    const cyw = Math.cos(view.yaw), syw = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    for (let k = 0; k < cloud.n; k++) {
      const x0 = cloud.pts[k * 3], y0 = cloud.pts[k * 3 + 1], z0 = cloud.pts[k * 3 + 2] - 2;
      const x1 = cyw * x0 + syw * z0, z1 = -syw * x0 + cyw * z0;
      const y2 = cp * y0 - sp * z1, z2 = sp * y0 + cp * z1, zz = z2 + view.dist;
      if (zz < 0.1) continue;
      const sx = (W / 2 + f * x1 / zz) | 0, sy = (H / 2 - f * y2 / zz) | 0;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
        const X = sx + dx, Y = sy + dy;
        if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
        const j = Y * W + X;
        if (zz < zb[j]) { zb[j] = zz; buf[j] = cloud.col[k]; }
      }
    }
  }
  g.putImageData(img, 0, 0);
}
let drag = null;
$("c3d").onmousedown = e => { drag = [e.clientX, e.clientY]; };
window.onmouseup = () => { drag = null; };
window.onmousemove = e => {
  if (!drag) return;
  view.yaw += (e.clientX - drag[0]) * 0.01;
  view.pitch += (e.clientY - drag[1]) * 0.01;
  drag = [e.clientX, e.clientY];
  render();
};
$("c3d").onwheel = e => { e.preventDefault(); view.dist = Math.max(1, view.dist * (e.deltaY > 0 ? 1.1 : 0.9)); render(); };
render();

setInterval(() => {
  const up = Date.now() - lastMsg < 3000;
  $("status").textContent = up ? "live" : "offline";
  $("status").className = up ? "up" : "";
}, 1000);
connect();
</script>
</body>
</html>
